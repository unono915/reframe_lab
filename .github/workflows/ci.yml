name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # RLS·RPC 통합 테스트는 Postgres에 직접 붙는다. 이 값이 없으면 vitest가 조용히
      # skip하고 job은 초록으로 끝난다 — 이 저장소가 이미 두 번 당한 "아무것도 검증하지
      # 않은 초록"이다. 워크플로 요약에 경고를 남겨 눈에 보이게 한다.
      #
      # ⚠️ 이 시크릿은 `docs/deployment.md` §6에 필요한 값으로 적혀 있었는데, 정작
      # 워크플로 어디에도 전달되지 않고 있었다(2026-09-08 발견). 등록해도 아무 일이
      # 일어나지 않는 상태였다.
      - name: 통합 테스트 자격증명 확인
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning title=통합 테스트를 건너뜁니다::SUPABASE_DB_URL 시크릿이 없어 tests/integration/의 RLS 4건 + RPC 재조정 2건을 실행하지 않았습니다. 이 워크플로는 지금 데이터 접근 경계를 검증하지 못합니다."
          fi

      - run: npm run test -- --coverage
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # 의존성 취약점 스캔(Phase 6 보안 점검). high 이상이면 실패한다 —
      # 빌드 도구의 전이 의존이라도 방치하면 계속 쌓인다.
      - run: npm audit --audit-level=high
      # 빌드는 Supabase 환경변수를 요구한다(next.config.ts). CI는 실제 Supabase에
      # 접속하지 않으므로 형식만 맞는 더미 값을 넣는다 — 검증 로직 자체가 도는지도
      # 함께 확인된다. 실제 값은 배포 환경(Vercel)에만 있다.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  e2e:
    runs-on: ubuntu-latest
    needs: typecheck-lint-test
    # E2E는 실제 Supabase 프로젝트를 대상으로 돈다(로그인·RLS·RPC를 진짜로 통과해야
    # 의미가 있다). 그래서 아래 4개 시크릿이 필요하다:
    #   E2E_SUPABASE_URL / E2E_SUPABASE_ANON_KEY — 앱 빌드·실행용
    #   E2E_TEST_EMAIL / E2E_TEST_PASSWORD       — 이메일 인증을 마친 전용 테스트 계정
    #
    # 시크릿이 없으면 테스트를 "돌린 척"하지 않고 건너뛴다. 예전에는 자격증명이
    # 없어도 job이 초록으로 끝났는데, 그 초록은 아무것도 검증하지 않은 초록이었다 —
    # 실제로 완주 테스트 4개가 2주 가까이 깨진 채로 지나갔다(2026-09-08 발견).
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - id: creds
        name: E2E 자격증명 확인
        run: |
          if [ -n "$E2E_TEST_EMAIL" ] && [ -n "$E2E_TEST_PASSWORD" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E를 건너뜁니다::시크릿(E2E_SUPABASE_URL, E2E_SUPABASE_ANON_KEY, E2E_TEST_EMAIL, E2E_TEST_PASSWORD)이 없어 브라우저 테스트를 실행하지 않았습니다. 이 워크플로는 지금 훈련 완주 경로를 전혀 검증하지 못합니다."
          fi

      - if: steps.creds.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.creds.outputs.ready == 'true'
        run: npm run test:e2e
      - if: always() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
